name: One-time SmartBrake repository cleanup

on:
  push:
    paths:
      - ".assemble-upload"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean repository and sanitize public firmware
        run: |
          set -e

          # Replace the public AP password with a safe placeholder.
          sed -i 's/const char\* AP_PASS = "edubrake2026";/const char* AP_PASS = "CHANGE_ME";/' src/main.cpp

          # Remove placeholder/staging files left from the previous upload attempt.
          rm -f src/README.md
          rm -f .assemble-upload

          # Normalize KiCad project filenames and remove local KiCad preferences.
          if [ -f "docs/schematic/BrakePressure4 (1).kicad_sch" ]; then
            git mv "docs/schematic/BrakePressure4 (1).kicad_sch" docs/schematic/BrakePressure4.kicad_sch
          fi
          if [ -f "docs/schematic/BrakePressure4 (1).kicad_pcb" ]; then
            git mv "docs/schematic/BrakePressure4 (1).kicad_pcb" docs/schematic/BrakePressure4.kicad_pcb
          fi
          if [ -f "docs/schematic/BrakePressure4 (1).kicad_pro" ]; then
            git mv "docs/schematic/BrakePressure4 (1).kicad_pro" docs/schematic/BrakePressure4.kicad_pro
          fi
          rm -f "docs/schematic/BrakePressure4 (1).kicad_prl"

          # Remove this temporary workflow after it has done its job.
          rm -f .github/workflows/assemble-upload.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repository and sanitize public firmware"
          git push
