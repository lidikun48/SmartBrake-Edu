name: Assemble uploaded project files

on:
  push:
    paths:
      - ".assemble-upload"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble firmware and schematic
        run: |
          mkdir -p src docs/schematic
          cat .upload/main.cpp.gz.b64.* | base64 --decode | gzip --decompress > src/main.cpp
          cat .upload/BrakePressure4.kicad_sch.gz.b64.* | base64 --decode | gzip --decompress > docs/schematic/BrakePressure4.kicad_sch
          echo "Firmware SHA256:"
          sha256sum src/main.cpp
          echo "Schematic SHA256:"
          sha256sum docs/schematic/BrakePressure4.kicad_sch

      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp docs/schematic/BrakePressure4.kicad_sch
          git commit -m "Add final firmware and KiCad schematic"
          git push
